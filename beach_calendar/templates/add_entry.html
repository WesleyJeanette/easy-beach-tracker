{% extends 'base.html' %}
{% block title %}Beach Calendar{% endblock %}

{% block content %}
<body>
    <h1>Create a New Calendar Entry</h1>
    <form method="post">
        {% csrf_token %}
        
        <label for="beach">Beach Name:</label>
        <input type="text" id="beach" name="beach" list="recent-beaches" required>
        <datalist id="recent-beaches">
            {% for beach in recent_beaches %}
                <option value="{{ beach }}"></option>
            {% endfor %}
        </datalist>
        <br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" value="{{ selected_date }}" required><br><br>

        <label for="time_of_visit">Time:</label>
        <input type="time" id="time_of_visit" name="time_of_visit" required><br><br>

        <label for="notes">Notes:</label>
        <textarea id="notes" name="notes"></textarea><br><br>

        <div id="conditions-fields">
            <label for="weather_conditions">Weather Conditions:</label>
            <input type="text" id="weather_conditions" name="weather_conditions"><br><br>

            <label for="water_conditions">Water Conditions:</label>
            <input type="text" id="water_conditions" name="water_conditions"><br><br>
        </div>
        
        <label for="walked">Walked:</label>
        <input type="checkbox" id="walked" name="walked"><br><br>

        <label for="swam">Swam:</label>
        <input type="checkbox" id="swam" name="swam"><br><br>

        <label for="pull_conditions">Get Conditions:</label>
        <input type="checkbox" id="pull_conditions" name="pull_conditions" {% if entry.pull_conditions %}checked{% endif %} onchange="toggleConditionsFields()"><br><br>

        <button type="submit">Create Entry</button>
    </form>

    <script>
        function toggleConditionsFields() {
            const pullConditionsCheckbox = document.getElementById('pull_conditions');
            const conditionsFields = document.getElementById('conditions-fields');

            if (pullConditionsCheckbox.checked) {
                // Hide the weather and water conditions fields
                conditionsFields.style.display = 'none';
            } else {
                // Show the weather and water conditions fields
                conditionsFields.style.display = 'block';
            }
        }

        // Initialize the visibility of the fields on page load
        document.addEventListener('DOMContentLoaded', () => {
            toggleConditionsFields();
        });
    </script>
</body>
{% endblock %}
